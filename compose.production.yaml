
name: skillswap-production

services:
  db:
    image: mysql:8.4
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: skillswap_production
      MYSQL_USER: ${DB_USER:-skillswap}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}

    volumes:
      - mysql_production_data:/var/lib/mysql

    healthcheck:
      test:
        - CMD-SHELL
        - 'mysqladmin ping -h 127.0.0.1 -u root -p"$$MYSQL_ROOT_PASSWORD" --silent'
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s

  web:
    build:
      context: .
      dockerfile: Dockerfile.production

    restart: unless-stopped

    environment:
      RAILS_ENV: production
      RACK_ENV: production
      RAILS_LOG_TO_STDOUT: "true"

      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: skillswap_production
      DB_USER: ${DB_USER:-skillswap}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}

      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?Set SECRET_KEY_BASE}

      FORCE_SSL: "false"

    ports:
      - "127.0.0.1:3001:3000"

    depends_on:
      db:
        condition: service_healthy

    command:
      - bash
      - -lc
      - bundle exec ruby bin/rails db:prepare && bundle exec ruby bin/rails server -b 0.0.0.0 -p 3000

volumes:
  mysql_production_data:
